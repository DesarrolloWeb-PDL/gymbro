<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <!-- The recolourable glyph: the Olympic barbell mark on the 352x174 grid (x 80..432,
       y 169..343), square corners, brand orange. This is what glyph() reads and what every
       colour variant recolours - NOT the app icon, which is the multi-colour plate in
       resources/icon.svg and goes through drawArt as an `art` variant. -->
  <rect width="512" height="512" fill="#121212"/>
  <g fill="#ff7622">
    <rect x="80" y="248" width="352" height="16"/>
    <rect x="85" y="223" width="19" height="66"/>
    <rect x="107" y="199" width="20" height="114"/>
    <rect x="130" y="169" width="26" height="174"/>
    <rect x="356" y="169" width="26" height="174"/>
    <rect x="385" y="199" width="20" height="114"/>
    <rect x="408" y="223" width="19" height="66"/>
  </g>
</svg>
