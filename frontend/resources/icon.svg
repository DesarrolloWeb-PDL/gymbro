<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <!-- App icon: an Olympic bumper plate. Generated by plate-icon.mjs.
       Marked outer rim, face, marked inner ring, metal collar, sleeve hole - the structure the
       reference plates have.

       This file is the `art` of the default icon variant, so it is rasterised by drawArt
       (frontend/scripts/app-icons.mjs -> scene()), which understands rect, circle, line,
       polyline and polygon and paints them in order. It is deliberately NOT the glyph source:
       glyph() reads resources/mark.svg, because the recolourable variants are a single colour
       each and this plate is five bands of three colours. Splitting the two files is what lets
       the icon be multi-colour without breaking neon, light, mono and the rest.

       Only rect and circle here, because drawArt does not apply transform and throws on
       <text> and <path>. That is why the name is not on the icon: it lives in the sign-in
       lockup, the manifest and the footer of every shared card. -->
  <rect width="512" height="512" fill="#121212"/>
  <circle cx="256" cy="256" r="196" fill="#c26a00"/>
  <circle cx="256" cy="256" r="174" fill="#ff7622"/>
  <circle cx="256" cy="256" r="84" fill="#c26a00"/>
  <circle cx="256" cy="256" r="68" fill="#ffffff"/>
  <circle cx="256" cy="256" r="40" fill="#121212"/>
</svg>
